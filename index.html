<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050607" />
    <title>RUF API Platform</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background: #050607;
      }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.08), transparent 42%),
          linear-gradient(180deg, #0d1015 0%, #050607 58%, #020304 100%);
      }

      body {
        color: #ffffff;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      .startupSplash {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      .startupSplash__inner {
        display: grid;
        justify-items: center;
        gap: 18px;
      }

      .startupSplash__logo {
        font-size: clamp(64px, 14vw, 160px);
        line-height: 0.9;
        font-weight: 900;
        letter-spacing: 0.22em;
        text-indent: 0.22em;
        text-transform: uppercase;
        text-shadow: 0 10px 32px rgba(0, 0, 0, 0.45);
      }

      .startupSplash__subtitle {
        font-size: clamp(12px, 1.6vw, 16px);
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.7);
        text-indent: 0.42em;
      }

      .startupSplash__status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
        color: rgba(255, 255, 255, 0.82);
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .startupSplash__pulse {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: #ffffff;
        box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.65);
        animation: startup-pulse 1.4s ease-out infinite;
      }

      @keyframes startup-pulse {
        0% {
          transform: scale(0.92);
          box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.55);
          opacity: 0.9;
        }

        70% {
          transform: scale(1);
          box-shadow: 0 0 0 18px rgba(255, 255, 255, 0);
          opacity: 1;
        }

        100% {
          transform: scale(0.92);
          box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
          opacity: 0.9;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startupSplash" aria-label="Loading RUF API Platform">
        <div class="startupSplash__inner">
          <div class="startupSplash__logo">RUF</div>
          <div class="startupSplash__subtitle">API Platform</div>
          <div class="startupSplash__status">
            <span class="startupSplash__pulse" aria-hidden="true"></span>
            <span>Loading application</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
